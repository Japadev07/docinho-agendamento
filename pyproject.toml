[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docinho-agendamento"
version = "1.0.0"
description = "Sistema de Agendamento de Festas — Docinho Recreação Infantil (POO em Python)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
docinho = "docinho.menu:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
python_classes = ["Teste*"]
